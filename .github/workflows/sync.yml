name: Sync Lark -> Báo cáo

on:
  workflow_dispatch:        # cho phép bấm chạy tay trong tab Actions
  schedule:
    - cron: '0 2 * * *'     # 02:00 UTC = 09:00 giờ VN
    - cron: '0 7 * * *'     # 07:00 UTC = 14:00 giờ VN
    - cron: '0 14 * * *'    # 14:00 UTC = 21:00 giờ VN

permissions:
  contents: write           # cho phép commit data.json + ảnh

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Đồng bộ từ Lark Base
        env:
          LARK_APP_ID:     ${{ secrets.LARK_APP_ID }}
          LARK_APP_SECRET: ${{ secrets.LARK_APP_SECRET }}
          LARK_APP_TOKEN:  ${{ secrets.LARK_APP_TOKEN }}
          LARK_TABLE_ID:   ${{ secrets.LARK_TABLE_ID }}
          LARK_DOMAIN:     ${{ secrets.LARK_DOMAIN }}   # tùy chọn; bỏ trống = open.larksuite.com
          SYNC_MONTH:      "2026-06,2026-07"            # các tháng đưa vào báo cáo (nút T6/T7). Thêm tháng: nối bằng dấu phẩy
        run: python sync_lark.py

      - name: Commit kết quả
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json images
          if git diff --cached --quiet; then
            echo "Không có thay đổi."
          else
            git commit -m "Cập nhật báo cáo nghiệm thu salon ($(date -u +%Y-%m-%d))"
            git push
          fi
