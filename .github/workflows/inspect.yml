name: Inspect Lark fields (chỉ đọc)

on:
  workflow_dispatch:        # chỉ chạy tay; không có schedule, không ghi file

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Liệt kê tên cột trong Lark
        env:
          LARK_APP_ID:     ${{ secrets.LARK_APP_ID }}
          LARK_APP_SECRET: ${{ secrets.LARK_APP_SECRET }}
          LARK_APP_TOKEN:  ${{ secrets.LARK_APP_TOKEN }}
          LARK_TABLE_ID:   ${{ secrets.LARK_TABLE_ID }}
          LARK_DOMAIN:     ${{ secrets.LARK_DOMAIN }}
        run: python inspect_lark_fields.py
